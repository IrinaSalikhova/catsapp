runtime: nodejs22
env: standard
instance_class: F1

handlers:
  # Route API requests to Node.js backend
  - url: /api/.*
    script: auto

  # Default route to serve React's index.html
  - url: /
    static_files: frontend/dist/index.html
    upload: frontend/dist/index.html

  # Serve React app's static files
  - url: /
    static_dir: frontend/dist